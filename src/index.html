<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World!</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="dark-theme">

    <div id="HEADER">
      <button id="HEADER_buttonSettings">Settings</button>
      |
      <input type='checkbox' id='HEADER_toggleShowExplorer' checked/>
      <label for='HEADER_toggleShowExplorer'>ShowExplorer</label>
      |
      <button id="EXPLORER_folderOrWorkspaceButtons">
          OpFoOrWo
      </button>
      |
      <button id="EDI_gotoF">
        <!-- Use select to provide more meaning of what this UI does? -->
        Goto F
      </button>
    </div>

    <div id="BODY">
      <!-- TODO: "Move" the tab index to the "TreeViewComponent"? -->
      <div id="EXPLORER">
      </div>
      <div id="EDI_hack">
        <!-- See #EDI_debug for #EDI_hack explanation -->
        
        <!--
        These are in the wrong order for "z axis" of like what it ontop of one another
        you get this weird low opacity see through effect currently
        but I have no idea what I'm doing
        and I have 0 energy to do anything and I can't bear to think about this
        right now but I'm aware.
        -->

        <!-- THE ROOT WRAPPER: Matches your exact view size (e.g., 589px × 526px) -->
        <div id="EDITOR" tabindex="0">
          
          <!-- IMPORTANT: All child nodes are referenced by hardcoded numbers and cached from within 'EDI_init'. If you modify the children you need to update these hardcoded numbers respectively. -->

          <!-- LAYER 1: The Native Scroll Container.
               This element is purely an invisible frame that hosts your native scrollbars. -->
          <div id="EDI_scroll_viewport" style="position: absolute; inset: 0; overflow: scroll; z-index: 3;">
            <!-- This element stretches to your full content size (240,019px) to force the native scrollbar thumb to scale correctly. -->
            <div id="EDI_scrollbar_space_generator"></div>
          </div>

          <!-- LAYER 2: The Visible UI Canvas.
              This stays perfectly locked to the screen and never grows or moves natively. -->
          <div id="EDI_visual_canvas" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1;">
            
            <!-- Isolated Gutter -->
            <div id="EDI_gutter_container" style="position: absolute; left: 0; top: 0; height: 100%;">
              <!-- Virtualized line numbers go here -->
            </div>
            
            <!-- Isolated Text Body Container (#EDI_body) -->
            <div id="EDI_text" style="position: absolute; top: 0; right: 0; height: 100%;">
              <div id="EDI_presentation" style="position: absolute; inset: 0; pointer-events: none; z-index: 1;"></div>
              <div id="EDI_cursorList" style="z-index: 2;"></div>
              <!-- Virtualized text lines go here (.eT elements) -->
            </div>

          </div>
        </div>
        <div id="EDI_findOverlay" style="visibility: hidden;"></div>
        <div id="EDI_debug">
          <!--
          Not having this as a child to the #EDITOR is annoying,
          but I'd have to change around a good bit of code to make that work due to virtualization and possibly further etc...
          -->
        </div>
      </div>
    </div>

    <script type="module" src="../build/__COMPILEDbundle__.js"></script>
  </body>
</html>
